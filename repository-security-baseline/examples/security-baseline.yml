# Copy to .github/workflows/security-baseline.yml in your repository.
# Configure repository variables below; no implementation edits required.
name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, catches new CVEs in unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    # Pin to a full commit SHA in production, e.g. @<40-char-sha> # v1.0.0
    uses: your-org/repository-security-scanning/.github/workflows/security-baseline.yml@v1.0.0
    with:
      mode: report
      runner: ${{ vars.SECURITY_RUNNER || '["ubuntu-24.04"]' }}
      results-storage: ${{ vars.SECURITY_RESULTS_STORAGE || 'branch' }}
      cache-db: ${{ vars.SECURITY_CACHE_DB == 'true' }}

  codeql:
    needs: security-baseline
    if: ${{ !cancelled() && vars.CODEQL_LANGUAGES != '' }}
    permissions:
      contents: read
      security-events: write
    uses: your-org/repository-security-scanning/.github/workflows/codeql.yml@v1.0.0
    with:
      languages: ${{ vars.CODEQL_LANGUAGES }}
      runner: ${{ vars.SECURITY_RUNNER || '["ubuntu-24.04"]' }}

  publish:
    needs: [security-baseline, codeql]
    if: >-
      always() && (vars.SECURITY_RESULTS_STORAGE || 'branch') == 'branch' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    uses: your-org/repository-security-scanning/.github/workflows/publish-results.yml@v1.0.0
    with:
      runner: ${{ vars.SECURITY_RUNNER || '["ubuntu-24.04"]' }}
      summary: ${{ needs.security-baseline.outputs.summary }}
      scan-result: ${{ needs.security-baseline.result }}
      results-branch: ${{ vars.SECURITY_RESULTS_BRANCH || 'security-results' }}
      results-path: ${{ vars.SECURITY_RESULTS_PATH || 'security-summary.json' }}
