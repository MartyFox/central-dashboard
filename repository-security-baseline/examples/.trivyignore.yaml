# Copy to the root of your repository as .trivyignore.yaml.
# Every exception needs a statement (why it is safe, who accepted it) and an expired_at
# no more than 180 days away. Expired entries stop suppressing findings automatically.
vulnerabilities:
  - id: CVE-0000-00000
    paths:
      - package-lock.json
    statement: Vulnerable function not reachable from our code. Accepted by <name>, <ticket>.
    expired_at: 2026-12-31
secrets: []
misconfigurations: []
