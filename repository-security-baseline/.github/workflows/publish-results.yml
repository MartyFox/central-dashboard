name: Publish security summary (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runner labels; publishing requires Node.js 24 and a supported runner.
        type: string
        default: '["ubuntu-24.04"]'
      summary:
        description: Summary output from security-baseline.yml. Empty records a failed/incomplete scan.
        type: string
        default: ""
      scan-result:
        description: needs.scan.result, including failure or skipped.
        type: string
        required: true
      results-branch:
        description: Dedicated results branch; must not be the default branch.
        type: string
        default: security-results
      results-path:
        description: Summary file path on the dedicated branch.
        type: string
        default: security-summary.json

permissions:
  contents: read

jobs:
  publish:
    # Never publish PR data, including same-repository PRs or pull_request_target.
    if: >-
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    concurrency:
      group: security-results-${{ github.repository }}-${{ inputs.results-branch }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Commit sanitised result without checking out source code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ inputs.summary }}
          SCAN_RESULT: ${{ inputs.scan-result }}
          RESULTS_BRANCH: ${{ inputs.results-branch }}
          RESULTS_PATH: ${{ inputs.results-path }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'JS'
          const env = process.env;
          const branch = env.RESULTS_BRANCH;
          const path = env.RESULTS_PATH;
          const validBranch = typeof branch === 'string' &&
            /^[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(branch) &&
            !branch.includes('..') && !branch.includes('//') &&
            branch.split('/').every(part => part && !part.startsWith('.') && !part.endsWith('.') && !part.endsWith('.lock'));
          if (!validBranch || branch === env.SOURCE_BRANCH ||
              !/^(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_-]+\.json$/.test(path)) {
            throw new Error('Invalid dedicated results branch or JSON path');
          }
          if (!['success', 'failure', 'cancelled', 'skipped'].includes(env.SCAN_RESULT)) {
            throw new Error('Invalid scan-result');
          }
          const levels = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN'];
          const types = ['vulnerabilities', 'secrets', 'misconfigurations'];
          const integer = value => Number.isSafeInteger(value) && value >= 0;
          const runId = Number(env.RUN_ID);
          const runAttempt = Number(env.RUN_ATTEMPT);
          if (!integer(runId) || !runId || !integer(runAttempt) || !runAttempt) throw new Error('Invalid run identity');
          let summary = null;
          if (env.SUMMARY) {
            const raw = JSON.parse(env.SUMMARY);
            if (raw.schemaVersion !== 1 || !Number.isFinite(Date.parse(raw.scannedAt)) ||
                !integer(raw.detectedTargets) || !integer(raw.blockingCount) ||
                !Array.isArray(raw.scanners) || !raw.scanners.length ||
                !raw.scanners.every(value => ['vuln', 'secret', 'misconfig'].includes(value)) ||
                !['report', 'enforce'].includes(raw.mode) ||
                !Array.isArray(raw.blockingSeverities) || !raw.blockingSeverities.every(value => levels.includes(value)) ||
                typeof raw.failOnUnfixed !== 'boolean' || typeof raw.scope !== 'string' ||
                !Array.isArray(raw.skipDirs) || !raw.skipDirs.every(value => typeof value === 'string') ||
                typeof raw.scannerVersion !== 'string') throw new Error('Invalid scan summary');
            const counts = {};
            for (const type of types) {
              counts[type] = {};
              for (const severity of levels) {
                const value = raw.counts?.[type]?.[severity];
                if (!integer(value)) throw new Error('Invalid summary counts');
                counts[type][severity] = value;
              }
            }
            // Explicit field projection: never commit raw findings or arbitrary input fields.
            summary = {
              scannedAt: new Date(raw.scannedAt).toISOString(), counts,
              detectedTargets: raw.detectedTargets, blockingCount: raw.blockingCount,
              scanners: raw.scanners, scannerVersion: raw.scannerVersion,
              mode: raw.mode, blockingSeverities: raw.blockingSeverities,
              failOnUnfixed: raw.failOnUnfixed, scope: raw.scope, skipDirs: raw.skipDirs,
            };
          }
          const record = {
            schemaVersion: 1, repository: env.SOURCE_REPOSITORY, branch: env.SOURCE_BRANCH,
            sourceSha: env.SOURCE_SHA, runId, runAttempt, scanResult: env.SCAN_RESULT,
            scanOutcome: summary ? 'completed' : 'error', publishedAt: new Date().toISOString(),
            summary,
          };
          const base = `https://api.github.com/repos/${env.SOURCE_REPOSITORY}`;
          async function request(endpoint, method = 'GET', body, allowMissing = false) {
            const response = await fetch(`${base}${endpoint}`, {
              method, redirect: 'error', signal: AbortSignal.timeout(60000),
              headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            if (allowMissing && response.status === 404) return null;
            if (!response.ok) throw new Error(`Result publishing failed: GitHub HTTP ${response.status}`);
            return response.json();
          }
          const encodedBranch = branch.split('/').map(encodeURIComponent).join('/');
          const ref = await request(`/git/ref/heads/${encodedBranch}`, 'GET', undefined, true);
          let previous = null;
          if (ref) {
            const file = await request(`/contents/${path}?ref=${encodeURIComponent(branch)}`, 'GET', undefined, true);
            if (file) {
              if (file.encoding !== 'base64' || typeof file.content !== 'string') throw new Error('Invalid existing summary file');
              previous = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
              if (previous.schemaVersion !== 1 || previous.repository !== record.repository ||
                  previous.branch !== record.branch || !integer(previous.runId) || !integer(previous.runAttempt)) {
                throw new Error('Existing result belongs to a different source or has invalid run identity');
              }
              if (previous.runId > runId || (previous.runId === runId && previous.runAttempt >= runAttempt)) {
                console.log('Newer or identical result already published; not overwriting.');
                process.exit(0);
              }
            }
          }
          let parent;
          let tree;
          if (ref) {
            parent = ref.object.sha;
            tree = (await request(`/git/commits/${parent}`)).tree.sha;
          }
          const createdTree = await request('/git/trees', 'POST', {
            ...(tree ? { base_tree: tree } : {}),
            tree: [{ path, mode: '100644', type: 'blob', content: `${JSON.stringify(record, null, 2)}\n` }],
          });
          const commit = await request('/git/commits', 'POST', {
            message: `Update security summary for source run ${runId}/${runAttempt}`,
            tree: createdTree.sha, parents: parent ? [parent] : [],
          });
          if (ref) {
            await request(`/git/refs/heads/${encodedBranch}`, 'PATCH', { sha: commit.sha, force: false });
          } else {
            await request('/git/refs', 'POST', { ref: `refs/heads/${branch}`, sha: commit.sha });
          }
          console.log(`Published sanitised summary to ${branch}/${path}`);
          JS
