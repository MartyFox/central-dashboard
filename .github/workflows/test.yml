name: Test dashboard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ fromJSON(vars.DASHBOARD_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: repository-security-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm run check && npm test
      - name: Test baseline workflow contracts and packaging
        run: node --test ../repository-security-baseline/tests/*.test.mjs ../tests/*.test.mjs
